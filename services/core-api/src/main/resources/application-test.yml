# =====================================================================================
# Test profile.
#
# The DataSource is supplied programmatically by EmbeddedPostgresExtension, which starts a
# real PostgreSQL, creates both roles, and hands the application a connection as the RUNTIME
# role — never as a superuser.
#
# That last point is the whole reason this file exists rather than a plain H2 URL: a superuser
# bypasses Row Level Security unconditionally. Tests run as a superuser would pass every
# tenant-isolation assertion while proving nothing at all, and we would ship believing we were
# protected. See docs/adr/0012-testing-database-strategy.md.
# =====================================================================================

spring:
  datasource:
    url: ${TEST_DB_URL:}
    username: ${TEST_DB_APP_USER:sankofa_app}
    password: ${TEST_DB_APP_PASSWORD:sankofa_app_test_pw}
    hikari:
      pool-name: sankofa-test
      maximum-pool-size: 8
      minimum-idle: 1
      leak-detection-threshold: 10000

  flyway:
    enabled: true
    url: ${TEST_DB_URL:}
    user: ${TEST_DB_MIGRATE_USER:sankofa_migrate}
    password: ${TEST_DB_MIGRATE_PASSWORD:sankofa_migrate_test_pw}
    schemas: public
    locations: classpath:db/migration
    placeholders:
      appRole: sankofa_app
      migrateRole: sankofa_migrate

sankofa:
  firebase:
    project-id: sankofa-test
    credentials-path: ""
    storage-bucket: ""
  outbox:
    # The poller is driven explicitly in tests so assertions are deterministic rather than
    # racing a background thread.
    poll-interval: PT1H

logging:
  level:
    root: WARN
    io.sankofa.school: INFO
    org.flywaydb: INFO
