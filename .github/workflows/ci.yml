name: CI

# Quality gates. A failure here blocks the merge — the gate is not advisory, and it is not
# something to work around by weakening a rule or deleting a test (AGENTS.md §1).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  # ---------------------------------------------------------------------------------
  # Secrets must never reach the repository. This runs first and fast, because every
  # other job is wasted effort if a credential has already been committed.
  # ---------------------------------------------------------------------------------
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject committed credential files and private keys
        run: |
          set -euo pipefail
          # Filenames that should never exist in the tree at all.
          if git ls-files | grep -E '(serviceAccount.*\.json|\.pem$|\.p12$|\.jks$|^\.env$)' ; then
            echo "::error::A credential-shaped file is tracked in git. Remove it and rotate the credential."
            exit 1
          fi
          # Content patterns. .env.example is excluded by name because it is deliberately
          # full of dummy values that look like the real thing.
          if git grep -nIE '(BEGIN (RSA|EC|OPENSSH|PGP) PRIVATE KEY|"private_key_id"|sk_live_[0-9a-zA-Z]{20,}|postgres(ql)?://[^ "'"'"']*:[^ "'"'"'@]+@)' \
               -- ':!.env.example' ':!.github/workflows/*' ; then
            echo "::error::A secret-shaped literal is present in tracked content."
            exit 1
          fi

      - name: Reject server secrets exposed to the browser
        run: |
          set -euo pipefail
          # NEXT_PUBLIC_* is inlined into the client bundle. Anything secret behind that
          # prefix is published to every visitor.
          if git grep -nIE 'NEXT_PUBLIC_[A-Z0-9_]*(SECRET|PRIVATE|PASSWORD|TOKEN|KEY)' \
               -- ':!.github/workflows/*' ; then
            echo "::error::A secret is exposed through a NEXT_PUBLIC_ variable (AGENTS.md §1.5)."
            exit 1
          fi

  # ---------------------------------------------------------------------------------
  # Typecheck, lint, the fast tests and a production build.
  #
  # Lint is its own step rather than a side effect of the build. Next 16 removed ESLint from
  # `next build`, so relying on the build to run it would have meant lint quietly stopped
  # happening at the upgrade with nothing failing to say so.
  # ---------------------------------------------------------------------------------
  quality:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    needs: secret-scan

    # The build evaluates these but never uses their values: no tenant-scoped route is
    # prerendered, because every one of them is force-dynamic. They are obvious placeholders
    # so nobody mistakes them for configuration that matters.
    env:
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      DIRECT_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      NEXTAUTH_SECRET: ci-placeholder-value-never-used-for-anything-real
      NEXTAUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Generate the Prisma client
        run: npm run db:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------------
  # Everything that needs a real database.
  #
  # Tenant isolation cannot be proved against a mock: a mock agrees that the filter was
  # applied, which is the thing in doubt. A defect here is release-blocking, so this job
  # also refuses to pass if the isolation suite reported no tests at all.
  # ---------------------------------------------------------------------------------
  database:
    name: Migrations, seed and tenant isolation
    runs-on: ubuntu-latest
    needs: secret-scan

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sankofa
          POSTGRES_PASSWORD: sankofa
          POSTGRES_DB: sankofa_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # No pooler in CI, so both point at the same place. In production DATABASE_URL is
      # Supabase's Supavisor in transaction mode (:6543, with pgbouncer=true) and DIRECT_URL
      # is Supavisor in session mode (:5432), because migrations cannot run through a
      # transaction pooler.
      DATABASE_URL: postgresql://sankofa:sankofa@localhost:5432/sankofa_ci
      DIRECT_URL: postgresql://sankofa:sankofa@localhost:5432/sankofa_ci
      NEXTAUTH_SECRET: ci-placeholder-value-never-used-for-anything-real
      NEXTAUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Generate the Prisma client
        run: npm run db:generate

      # Applies the whole chain to an empty database, exactly as a deploy does. A migration
      # that only works on a database that already has the previous state fails here.
      - name: Apply migrations
        run: npm run db:deploy

      # Catches a schema.prisma edited without a matching migration. Without this the
      # application and the database disagree, and the first anyone hears of it is a
      # production query failing on a column that does not exist.
      - name: Fail if the schema and the migrations disagree
        run: |
          set -euo pipefail
          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code && echo "No drift." && exit 0
          echo "::error::prisma/schema.prisma does not match the applied migrations."
          echo "::error::Run: npm run db:migrate -- --name <what-you-changed>"
          exit 1

      - name: Seed
        run: npm run db:seed

      # The seed is idempotent by design. Running it twice is how that claim gets tested
      # rather than merely asserted in a comment.
      - name: Seed again, to prove it is idempotent
        run: npm run db:seed

      - name: Tenant isolation and database constraints
        run: npm run test:db -- --reporter=verbose --reporter=json --outputFile=db-results.json

      - name: Confirm the isolation suite actually ran
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f db-results.json ]; then
            echo "::error::The database suite produced no results file. It did not run."
            exit 1
          fi
          total=$(node -e "process.stdout.write(String(require('./db-results.json').numTotalTests ?? 0))")
          if [ "$total" -eq 0 ]; then
            echo "::error::The database suite reported zero tests. A silently skipped"
            echo "::error::tenant-isolation suite is a build failure, not a pass."
            exit 1
          fi
          echo "Database suite ran $total tests."

  # ---------------------------------------------------------------------------------
  # Migrations are history. Editing one that has already been applied breaks its checksum
  # in every environment that ran it (AGENTS.md §8).
  # ---------------------------------------------------------------------------------
  migrations-are-append-only:
    name: Migrations are append-only
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject modification of an existing migration
        run: |
          set -euo pipefail
          base="origin/${{ github.base_ref }}"
          git fetch --no-tags --depth=50 origin "${{ github.base_ref }}"
          changed=$(git diff --name-status "$base"...HEAD -- 'prisma/migrations/**' || true)
          # Added (A) is fine. Modified (M), Deleted (D) or Renamed (R) is not.
          offenders=$(echo "$changed" | grep -E '^[MDR]' || true)
          if [ -n "$offenders" ]; then
            echo "::error::An already-merged migration was modified or removed:"
            echo "$offenders"
            echo "::error::Add a NEW migration instead. Applied history is not edited."
            exit 1
          fi
          echo "Migration changes are additive only."

  # ---------------------------------------------------------------------------------
  # Dependency vulnerabilities. GitHub's dependency-review action requires GitHub Advanced
  # Security on private repositories. `npm audit` checks the complete locked dependency tree
  # without that plan requirement.
  # ---------------------------------------------------------------------------------
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check for high or critical dependency vulnerabilities
        run: npm audit --audit-level=high
